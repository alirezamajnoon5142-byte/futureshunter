services:
  - type: web
    name: futureshunter-v66
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python FuturesHunter_Render.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEBSITE_URL
        sync: false
